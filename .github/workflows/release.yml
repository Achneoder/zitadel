name: Release

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: "22"
      semantic_version:
        required: true
        type: string
      image_name_github_login:
        required: true
        type: string

env:
  default_labels: |
    org.opencontainers.image.documentation=https://zitadel.com/docs
    org.opencontainers.image.vendor=ZITADEL

jobs:
  version:
    uses: ./.github/workflows/version.yml
    permissions:
      contents: write
    with:
      semantic_version: ${{ inputs.semantic_version }}
      dry_run: false

  # TODO: remove the publish job and publish releases directly with the @semantic-release/github plugin (remove draftRelease: true)
  # as soon as it supports configuring the create release payload property make_latest to "legacy"
  # https://docs.github.com/en/rest/releases/releases?apiVersion=2022-11-28#create-a-release--parameters
  publish:
    runs-on: ubuntu-22.04
    needs: version
    if: needs.version.outputs.published == 'true'
    steps:
      - id: get_release
        uses: cardinalby/git-get-release-action@v1
        with:
          commitSha: ${{ github.sha }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.get_release.outputs.id }},
              draft: false,
              make_latest: "legacy"
            });

  docker:
    runs-on: ubuntu-22.04
    needs: [ version ]
    if: needs.version.outputs.published == 'true'
    steps:
    -
      name: Checkout Repository
      uses: actions/checkout@v4
    -
      name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false
    -
      name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: "pnpm"
    -
      name: Install dependencies
      run: pnpm install --frozen-lockfile
    -
      name: Build Login Standalone Output
      env:
        NX_NO_CLOUD: "true"
        NX_DAEMON: "false"
      run: pnpm nx run @zitadel/login:build
    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - 
      name: Login to Docker registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    -
      name: Generate Standard Tags and Labels from the GitHub Context for the Login Container Image
      id: login-meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ inputs.image_name_github_login }}
        labels: |
          org.opencontainers.image.licenses=MIT
          ${{ env.default_labels}}
        tags: |
          type=raw,value=${{ needs.version.outputs.version }}
          type=raw,value=latest,enable=${{ github.ref_name == 'next' }}
    -
      name: Build and Push the Login Container Image
      uses: docker/build-push-action@v6
      timeout-minutes: 10
      with:
        context: apps/login
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        push: true
        labels: ${{ steps.login-meta.outputs.labels }}
        tags: ${{ steps.login-meta.outputs.tags }}
